<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="flip/flip.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=Klee+One&family=Noto+Sans+JP&family=Noto+Serif+JP&family=Shippori+Mincho&family=Zen+Old+Mincho&display=swap" rel="stylesheet">
</head>
<body>

<div id="overlay">
  <span id="overlay-msg">loading…</span>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
</div>

<!-- ── FLIP HOME ──────────────────────────────────────────────────────────── -->
<section id="s-flip-home" class="screen">
  <div class="home-hdr">
    <h2 id="flip-home-title" class="mode-title">FLIP</h2>
    <div style="display:flex;gap:.4rem;align-items:center">
      <button class="btn toggle-btn on" id="fl-set-hira" title="Hiragana">あ</button>
      <button class="btn toggle-btn on" id="fl-set-kata" title="Katakana">ア</button>
      <button class="btn-gear" id="btn-fl-history" title="Stats">◎</button>
      <button class="btn-gear" id="btn-fl-settings" title="Settings">⚙</button>
    </div>
  </div>
  <div class="row-grid" id="fl-row-grid"></div>
  <button class="btn" id="fl-toggle-all" style="font-size:.75rem;color:#555;border-color:#1e1e1e">select all</button>
  <button class="btn go" id="fl-start">start</button>
  <button id="btn-fl-set-default" style="display:none"></button>
</section>

<!-- ── FLIP SETTINGS ──────────────────────────────────────────────────────── -->
<section id="s-flip-settings" class="screen">
  <h2>FLIP</h2>
  <div class="settings-list" style="width:100%">
    <div class="setting-row">
      <span class="setting-lbl">TIMEOUT</span>
      <div class="setting-ctrl">
        <input type="number" class="setting-num" id="fl-set-timer" min="1" max="10" step="0.5" value="5">
        <span class="setting-unit">s</span>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-lbl">DAKUTEN</span>
      <button class="btn toggle-btn off-state" id="fl-set-dakuten">OFF</button>
    </div>
    <div class="setting-row">
      <span class="setting-lbl">COMBOS</span>
      <button class="btn toggle-btn off-state" id="fl-set-combos">OFF</button>
    </div>
    <div class="setting-row">
      <span class="setting-lbl">SELECTION</span>
      <div class="fl-pick-btns">
        <button class="btn fl-pick-btn" id="fl-pick-random">random</button>
        <button class="btn fl-pick-btn on" id="fl-pick-session">session</button>
        <button class="btn fl-pick-btn" id="fl-pick-lifetime">lifetime</button>
      </div>
    </div>
  </div>
  <div class="hist-section-lbl">fonts</div>
  <div id="fl-font-grid"></div>
  <button class="btn" id="btn-fl-settings-back" style="font-size:.7rem;color:#333;border-color:#1a1a1a;padding:.3rem .8rem">← back</button>
</section>

<!-- ── FLIP ────────────────────────────────────────────────────────────────── -->
<section id="s-flip" class="screen">
  <span id="fl-count">#0</span>
  <div id="fl-card">
    <div id="fl-timer-wrap">
      <svg class="fl-t-svg" viewBox="0 0 200 200">
        <circle class="r-bg" cx="100" cy="100" r="88"/>
        <circle class="r-arc" cx="100" cy="100" r="88" id="fl-arc"/>
      </svg>
      <div class="big" id="fl-kana">?</div>
    </div>
    <p id="fl-hint">↓ · space · click</p>
    <div id="fl-answer">
      <div id="fl-romaji"></div>
      <div id="fl-altchar"></div>
    </div>
  </div>
  <div id="fl-btns">
    <button class="btn fl-btn-ok"  id="fl-correct">←  correct</button>
    <button class="btn fl-btn-err" id="fl-wrong">wrong  →</button>
  </div>
  <div id="fl-bar">
    <div id="fl-score-wrap">
      <span id="fl-score">0 / 0</span>
      <span id="fl-stats"></span>
    </div>
    <button class="btn" id="fl-end" style="font-size:.7rem;color:#222;border-color:#181818;padding:.3rem .8rem">end</button>
  </div>
</section>

<!-- ── FLIP SUMMARY ───────────────────────────────────────────────────────── -->
<section id="s-flip-sum" class="screen">
  <h2>FLIP</h2>
  <div id="fls-stats"></div>
  <div id="fls-heat"></div>
  <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap">
    <button class="btn go" id="btn-fl-again">again</button>
    <button class="btn"    id="btn-fl-home">home</button>
    <button class="btn"    id="btn-fls-history" style="font-size:.7rem;color:#333;border-color:#1a1a1a;padding:.3rem .8rem">◎ stats</button>
  </div>
</section>

<!-- ── HISTORY ────────────────────────────────────────────────────────────── -->
<section id="s-history" class="screen">
  <h2>STATS</h2>
  <div id="hist-lifetime"></div>
  <div class="hist-section-lbl">recent sessions</div>
  <div id="hist-sessions"></div>
  <div class="hist-section-lbl">weakest</div>
  <div id="hist-weakest"></div>
  <button class="btn" id="btn-hist-back" style="font-size:.7rem;color:#333;border-color:#1a1a1a;padding:.3rem .8rem">← back</button>
</section>

<script src="js/app.js"></script>
<script src="js/db.js"></script>
<script src="js/history.js"></script>
<script src="flip/flip.js"></script>
<script src="js/init.js"></script>
</body>
</html>
